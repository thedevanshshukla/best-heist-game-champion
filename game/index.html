<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBER HEIST // SHADOW PROTOCOL</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #050811;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: absolute;
    display: block;
    box-shadow: 0 0 35px rgba(0, 210, 255, 0.25);
    background: #070a12;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Cyber Heist: Shadow Protocol. Infiltrate the high-security facility, dodge guard vision cones, bypass laser grids, crack the vault and escape with the Quantum Core"></canvas>
<p id="status" role="status" aria-live="polite">Mission active</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
